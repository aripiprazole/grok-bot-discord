# Manual deploy of the full Worker, including the voice container.
# GitHub-hosted runners include Docker, which `wrangler deploy` uses to build voice.Dockerfile.
# Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then run this from the Actions tab.
# The token needs permission to deploy Workers and Container images.
name: Deploy with voice

on:
  workflow_dispatch:

jobs:
  deploy:
    name: wrangler deploy (voice)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install Wrangler
        working-directory: cloudflare
        run: npm ci

      - name: Deploy the Worker and voice container
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ../wrangler.jsonc
